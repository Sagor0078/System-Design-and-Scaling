apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: module4
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
      annotations:
        # Scrape config for a plain Prometheus; with kube-prometheus-stack use
        # a ServiceMonitor instead (see README).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orders
          image: module4/fault-tolerance-system:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "orders.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: orders
          envFrom:
            - configMapRef:
                name: orders-config

          # Startup probe first: a slow cold start must not be read as a crash.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30

          # Liveness asks only "is this process wedged?". It deliberately does
          # NOT check inventory: if it did, an inventory outage would restart
          # every orders pod, destroying the warm cache that is keeping the
          # service alive and turning degradation into an outage.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness asks "can this pod serve?" and so may consult the
          # breaker. It goes red only when the breaker is open AND the cache is
          # cold -- degraded-but-serving pods stay in rotation.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Requests are mandatory for the HPA: without them there is no
          # denominator for CPU utilisation and autoscaling silently never fires.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]

      # Give in-flight requests time to finish before the container is killed.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: module4
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: http
      port: 8000
      targetPort: http
