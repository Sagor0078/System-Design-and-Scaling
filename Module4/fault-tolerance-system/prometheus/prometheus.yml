# Scrape interval is deliberately short: chaos experiments last seconds, and a
# 15s interval would hide the breaker opening and closing again.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders
    static_configs:
      - targets: ["orders:8000"]

  - job_name: inventory
    static_configs:
      - targets: ["inventory:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
